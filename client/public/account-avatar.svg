<!-- Navbar shows this guest account image on small screens; it does not indicate a successful login. -->
<!-- viewBox defines a 24 by 24 drawing area; fill sets the shared color of its shapes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#6b7280">
  <!-- The circle draws the head: center (12, 8), radius 4. -->
  <circle cx="12" cy="8" r="4" />
  <!-- d describes the path used to draw the shoulders and body. -->
  <path d="M4 22v-2a8 8 0 0 1 16 0v2H4Z" />
</svg>
